name: One-time PR cleanup (11.09.2026)
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
permissions:
  pull-requests: write
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Close stale or junk PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for n in 95 98 99 100 101 102 103 104 105 106 107 108 117; do
            gh pr close "$n" --repo ${{ github.repository }} --comment "Закрыто автоматически: код уже в проде (части 32-33 смержены через PR #111) либо устаревший черновик автомержа." || echo "PR #$n: close failed or already closed"
          done
      - name: Merge pending real PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for n in 85 112 113 114 115 116; do
            gh pr merge "$n" --repo ${{ github.repository }} --squash --delete-branch || echo "PR #$n: merge failed (conflict or failing check) - needs manual review"
          done
